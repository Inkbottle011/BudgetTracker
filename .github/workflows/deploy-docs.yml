name: Deploy docs

# Builds the docs site (website/, with the pages from docs/) and publishes it to GitHub Pages:
# https://inkbottle011.github.io/BudgetTracker/
# Pull requests only build it, so a broken link is caught before merging.
on:
  push:
    branches: [master]
    paths: ['docs/**', 'website/**', '.github/workflows/deploy-docs.yml']
  pull_request:
    paths: ['docs/**', 'website/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Build (fails on broken links)
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
